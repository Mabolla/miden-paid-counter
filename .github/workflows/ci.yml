name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  integration-tests:
    name: Run integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Rust toolchain
        run: rustc --version
      - name: Run integration tests
        working-directory: integration
        run: cargo test
